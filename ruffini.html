<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regla de Ruffini — @clasesdenati</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }

    .tarjeta {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      font-size: 20px;
      color: #333;
      margin-bottom: 0.3rem;
    }

    .subtitulo {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 1.8rem;
    }

    /* ── SECCIÓN ── */

    .seccion {
      margin-bottom: 1.4rem;
    }

    .seccion label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
      font-weight: bold;
    }

    /* ── FILA DE INPUTS ── */

    .fila-inputs {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .grupo-input {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
    }

    .grupo-input span {
      font-size: 11px;
      color: #aaa;
    }

    /* ── INPUTS ── */

    input[type="text"] {
      width: 100%;
      padding: 10px 6px;
      font-size: 18px;
      text-align: center;
      border: 2px solid #ddd;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #4a7eff;
    }

    /* ── RAÍZ ── */

    .input-raiz-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-raiz-wrap span {
      font-size: 15px;
      color: #555;
    }

    input.raiz {
      width: 90px;
      padding: 10px;
      font-size: 18px;
      text-align: center;
      border: 2px solid #ff9800;
      border-radius: 8px;
      outline: none;
    }

    input.raiz:focus {
      border-color: #e65100;
    }

    /* ── BOTÓN MENOS ÚNICO ── */

    .zona-controles {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn-menos {
      width: 58px;
      height: 40px;
      padding: 0;
      font-size: 22px;
      font-weight: bold;
      color: #555;
      background: #f5f5f5;
      border: 2px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-menos:active {
      background: #e5e5e5;
    }

    /* ── BOTÓN SIGUIENTE ── */

    .btn-avanzar {
      width: 130px;
      height: 40px;
      padding: 0;
      font-size: 14px;
      font-weight: bold;
      color: white;
      background: #4a7eff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-avanzar:hover {
      background: #2a5edd;
    }

    .btn-avanzar:active {
      background: #244fc2;
    }

    /* ── BOTÓN CALCULAR ── */

    .btn-calcular {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      background: #4a7eff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
    }

    .btn-calcular:hover {
      background: #2a5edd;
    }

    /* ── ERROR ── */

    .error {
      color: #e03e3e;
      font-size: 13px;
      text-align: center;
      margin-top: 8px;
      min-height: 18px;
    }

    /* ── RESULTADO ── */

    .resultado {
      margin-top: 1.8rem;
      display: none;
    }

    .resultado h2 {
      font-size: 15px;
      color: #333;
      margin-bottom: 1rem;
      text-align: center;
    }

    /* ── TABLA RUFFINI ── */

    .tabla-ruffini {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      font-size: 18px;
    }

    .tabla-ruffini td {
      text-align: center;
      padding: 10px 6px;
      min-width: 44px;
    }

    .fila-coef td {
      font-weight: bold;
      color: #222;
      border-bottom: 2px solid #4a7eff;
    }

    .celda-raiz {
      background: #fff3e0;
      border-radius: 6px;
      color: #e65100 !important;
      font-weight: bold;
    }

    .fila-bajada td {
      color: #888;
      font-size: 14px;
    }

    .fila-resultado td {
      font-weight: bold;
      color: #4a7eff;
      border-top: 2px solid #4a7eff;
      padding-top: 8px;
    }

    .celda-resto {
      color: #2a9d5c !important;
    }

    /* ── FICHAS ── */

    .fichas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .ficha {
      background: #f8f9ff;
      border: 1px solid #e0e7ff;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .ficha .etiqueta {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .ficha .valor {
      font-size: 14px;
      color: #333;
      font-weight: bold;
      word-break: break-all;
    }

    .ficha.resto .valor {
      color: #2a9d5c;
    }

    /* ── BOTÓN LIMPIAR ── */

    .btn-limpiar {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      background: #f5f5f5;
      color: #555;
      border: 1px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 1rem;
    }

    .btn-limpiar:hover {
      background: #eee;
    }

  </style>
</head>

<body>

<div class="tarjeta">

  <h1>Regla de Ruffini</h1>

  <p class="subtitulo">
    Polinomio de grado 3 · @clasesdenati
  </p>


  <!-- ─────────────────────────
       COEFICIENTES
  ───────────────────────── -->

  <div class="seccion">

    <label>
      Coeficientes del polinomio
      <br>
      P(x) = ax³ + bx² + cx + d
    </label>

    <div class="fila-inputs">

      <div class="grupo-input">
        <span></span>
        <input
          type="text"
          inputmode="decimal"
          id="a"
          placeholder="a"
          enterkeyhint="next"
          autocomplete="off"
        >
      </div>

      <div class="grupo-input">
        <span></span>
        <input
          type="text"
          inputmode="decimal"
          id="b"
          placeholder="b"
          enterkeyhint="next"
          autocomplete="off"
        >
      </div>

      <div class="grupo-input">
        <span></span>
        <input
          type="text"
          inputmode="decimal"
          id="c"
          placeholder="c"
          enterkeyhint="next"
          autocomplete="off"
        >
      </div>

      <div class="grupo-input">
        <span></span>
        <input
          type="text"
          inputmode="decimal"
          id="d"
          placeholder="d"
          enterkeyhint="next"
          autocomplete="off"
        >
      </div>

    </div>

  </div>


  <!-- ─────────────────────────
       RAÍZ
  ───────────────────────── -->

  <div class="seccion">

    <label>
      Raíz del divisor
      <br>
      (x − α)
    </label>

    <div class="input-raiz-wrap">

      <span></span>

      <input
        type="text"
        inputmode="decimal"
        id="raiz"
        class="raiz"
        placeholder="α"
        enterkeyhint="done"
        autocomplete="off"
      >

    </div>

  </div>


  <!-- ─────────────────────────
       CONTROLES
       UN SOLO BOTÓN MENOS
  ───────────────────────── -->

  <div class="zona-controles">

    <button
      type="button"
      class="btn-menos"
      id="btn-menos"
      onclick="ponerMenos()"
    >
      −
    </button>

    <button
      type="button"
      class="btn-avanzar"
      id="btn-avanzar"
      onclick="avanzarManual()"
    >
      Siguiente →
    </button>

  </div>


  <!-- CALCULAR -->

  <button
    type="button"
    class="btn-calcular"
    onclick="calcular()"
  >
    Calcular Ruffini
  </button>


  <div class="error" id="error"></div>


  <!-- ─────────────────────────
       RESULTADO
  ───────────────────────── -->

  <div class="resultado" id="resultado">

    <h2>Resultado</h2>


    <!-- TABLA RUFFINI -->

    <table class="tabla-ruffini">

      <tr class="fila-coef">

        <td></td>

        <td id="td-a">—</td>

        <td id="td-b">—</td>

        <td id="td-c">—</td>

        <td id="td-d">—</td>

      </tr>


      <tr class="fila-bajada">

        <td
          class="celda-raiz"
          id="td-raiz"
        >
          —
        </td>

        <td>↓</td>

        <td id="td-m1">—</td>

        <td id="td-m2">—</td>

        <td id="td-m3">—</td>

      </tr>


      <tr class="fila-resultado">

        <td></td>

        <td id="td-r0">—</td>

        <td id="td-r1">—</td>

        <td id="td-r2">—</td>

        <td
          class="celda-resto"
          id="td-r3"
        >
          —
        </td>

      </tr>

    </table>


    <!-- FICHAS -->

    <div class="fichas">

      <div class="ficha">

        <div class="etiqueta">
          Dividendo P(x)
        </div>

        <div
          class="valor"
          id="f-dividendo"
        >
          —
        </div>

      </div>


      <div class="ficha">

        <div class="etiqueta">
          Divisor D(x)
        </div>

        <div
          class="valor"
          id="f-divisor"
        >
          —
        </div>

      </div>


      <div class="ficha">

        <div class="etiqueta">
          Cociente Q(x)
        </div>

        <div
          class="valor"
          id="f-cociente"
        >
          —
        </div>

      </div>


      <div class="ficha resto">

        <div class="etiqueta">
          Resto R
        </div>

        <div
          class="valor"
          id="f-resto"
        >
          —
        </div>

      </div>

    </div>


    <button
      type="button"
      class="btn-limpiar"
      onclick="limpiar()"
    >
      Limpiar y hacer otro
    </button>

  </div>

</div>


<script>

  /* ─────────────────────────────
     INPUT ACTIVO
  ───────────────────────────── */

  let inputActivo = null;


  const inputs = [
    'a',
    'b',
    'c',
    'd',
    'raiz'
  ];


  /* ─────────────────────────────
     DETECTAR INPUT ACTIVO
  ───────────────────────────── */

  inputs.forEach(function(id) {

    const input =
      document.getElementById(id);


    input.addEventListener(
      'focus',
      function() {

        inputActivo = input;

      }
    );


    input.addEventListener(
      'click',
      function() {

        inputActivo = input;

      }
    );


    input.addEventListener(
      'input',
      function() {

        inputActivo = input;

      }
    );

  });


  /* ─────────────────────────────
     PONER / QUITAR SIGNO MENOS
     
     UN SOLO BOTÓN PARA TODOS
  ───────────────────────────── */

  function ponerMenos() {

    const input = inputActivo;


    if (!input) {

      /*
        Si todavía no hay ningún input
        seleccionado, seleccionamos el primero.
      */

      const primero =
        document.getElementById('a');

      primero.focus();

      inputActivo = primero;

      return;

    }


    let valor =
      input.value;


    if (valor.startsWith('-')) {

      input.value =
        valor.substring(1);

    } else {

      input.value =
        '-' + valor;

    }


    input.focus();

  }


  /* ─────────────────────────────
     AVANZAR MANUALMENTE
     
     Especialmente útil en iPhone
  ───────────────────────────── */

  function avanzarManual() {

    if (!inputActivo) {

      document.getElementById('a').focus();

      inputActivo =
        document.getElementById('a');

      return;

    }


    const index =
      inputs.indexOf(inputActivo.id);


    if (index === -1) return;


    /*
      Si no es el último input,
      pasa al siguiente.
    */

    if (index < inputs.length - 1) {

      const siguiente =
        document.getElementById(
          inputs[index + 1]
        );

      siguiente.focus();

      inputActivo = siguiente;

    } else {

      /*
        En el último input:
        calcular automáticamente.
      */

      calcular();

    }

  }


  /* ─────────────────────────────
     FORMATEAR POLINOMIO
  ───────────────────────────── */

  function superindice(n) {

    const sup = {
      '0':'⁰',
      '1':'¹',
      '2':'²',
      '3':'³',
      '4':'⁴',
      '5':'⁵',
      '6':'⁶',
      '7':'⁷',
      '8':'⁸',
      '9':'⁹'
    };

    return String(n)
      .split('')
      .map(function(d) {
        return sup[d];
      })
      .join('');

  }


  function formatPolinomio(
    coefs,
    gradoInicial
  ) {

    let resultado = '';

    let g = gradoInicial;


    for (
      let i = 0;
      i < coefs.length;
      i++
    ) {

      let c = coefs[i];


      if (c === 0) {

        g--;

        continue;

      }


      /* Signo */

      if (resultado === '') {

        if (c < 0) {

          resultado += '−';

        }

      } else {

        resultado +=
          c > 0
            ? ' + '
            : ' − ';

      }


      const abs =
        Math.abs(c);


      /* Término */

      if (g === 0) {

        resultado += abs;

      }

      else if (g === 1) {

        resultado +=
          (abs === 1 ? '' : abs)
          + 'x';

      }

      else {

        resultado +=
          (abs === 1 ? '' : abs)
          + 'x'
          + superindice(g);

      }


      g--;

    }


    return resultado === ''
      ? '0'
      : resultado;

  }


  /* ─────────────────────────────
     CALCULAR RUFFINI
  ───────────────────────────── */

  function calcular() {

    const a =
      document.getElementById('a').value;

    const b =
      document.getElementById('b').value;

    const c =
      document.getElementById('c').value;

    const d =
      document.getElementById('d').value;

    const r =
      document.getElementById('raiz').value;


    const errorDiv =
      document.getElementById('error');


    /* Validar */

    if (
      a === '' ||
      b === '' ||
      c === '' ||
      d === '' ||
      r === ''
    ) {

      errorDiv.textContent =
        'Completá todos los campos.';

      return;

    }


    errorDiv.textContent = '';


    const A =
      parseFloat(a);

    const B =
      parseFloat(b);

    const C =
      parseFloat(c);

    const D =
      parseFloat(d);

    const R =
      parseFloat(r);


    /* Validar coeficiente principal */

    if (A === 0) {

      errorDiv.textContent =
        'El coeficiente de x³ no puede ser 0.';

      return;

    }


    /* ─────────────────────────
       ALGORITMO DE RUFFINI
    ───────────────────────── */

    const r0 = A;

    const m1 = r0 * R;

    const r1 = B + m1;

    const m2 = r1 * R;

    const r2 = C + m2;

    const m3 = r2 * R;

    const r3 = D + m3;


    /* ─────────────────────────
       TABLA
    ───────────────────────── */

    document.getElementById(
      'td-raiz'
    ).textContent = R;


    document.getElementById(
      'td-a'
    ).textContent = A;


    document.getElementById(
      'td-b'
    ).textContent = B;


    document.getElementById(
      'td-c'
    ).textContent = C;


    document.getElementById(
      'td-d'
    ).textContent = D;


    document.getElementById(
      'td-m1'
    ).textContent = m1;


    document.getElementById(
      'td-m2'
    ).textContent = m2;


    document.getElementById(
      'td-m3'
    ).textContent = m3;


    document.getElementById(
      'td-r0'
    ).textContent = r0;


    document.getElementById(
      'td-r1'
    ).textContent = r1;


    document.getElementById(
      'td-r2'
    ).textContent = r2;


    document.getElementById(
      'td-r3'
    ).textContent = r3;


    /* ─────────────────────────
       FICHAS
    ───────────────────────── */

    const dividendo =
      formatPolinomio(
        [A, B, C, D],
        3
      );


    document.getElementById(
      'f-dividendo'
    ).textContent =
      dividendo;


    const divisorStr =
      R >= 0
        ? 'x − ' + R
        : 'x + ' + Math.abs(R);


    document.getElementById(
      'f-divisor'
    ).textContent =
      divisorStr;


    const cociente =
      formatPolinomio(
        [r0, r1, r2],
        2
      );


    document.getElementById(
      'f-cociente'
    ).textContent =
      cociente;


    document.getElementById(
      'f-resto'
    ).textContent =
      r3;


    /* Mostrar resultado */

    document.getElementById(
      'resultado'
    ).style.display =
      'block';


    document.getElementById(
      'resultado'
    ).scrollIntoView({
      behavior: 'smooth'
    });

  }


  /* ─────────────────────────────
     ENTER / NEXT / DONE
     
     PC + Samsung
     
     En iPhone queda además
     disponible "Siguiente →"
  ───────────────────────────── */

  inputs.forEach(
    function(id, index) {

      document
        .getElementById(id)
        .addEventListener(
          'keydown',
          function(e) {

            if (
              e.key !== 'Enter' &&
              e.keyCode !== 13
            ) {

              return;

            }


            e.preventDefault();


            if (
              index <
              inputs.length - 1
            ) {

              const siguiente =
                document.getElementById(
                  inputs[index + 1]
                );

              siguiente.focus();

              inputActivo =
                siguiente;

            } else {

              calcular();

            }

          }
        );

    }
  );


  /* ─────────────────────────────
     LIMPIAR
  ───────────────────────────── */

  function limpiar() {

    inputs.forEach(
      function(id) {

        document.getElementById(
          id
        ).value = '';

      }
    );


    document.getElementById(
      'resultado'
    ).style.display =
      'none';


    document.getElementById(
      'error'
    ).textContent = '';


    const primero =
      document.getElementById('a');


    primero.focus();

    inputActivo =
      primero;

  }


  /* ─────────────────────────────
     ARRANCAR
  ───────────────────────────── */

  document
    .getElementById('a')
    .focus();

  inputActivo =
    document.getElementById('a');

</script>

</body>
</html>
